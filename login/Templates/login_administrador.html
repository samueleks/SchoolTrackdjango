<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolTrack - Login Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .header-pro {
            background-color: #2b63d9 !important;
            height: 90px;
            border-bottom: 4px solid #1e40af;
            width: 100%;
        }
        .main-frame-white {
            background-color: white;
            border-radius: 1.5rem;
            border: 2px solid #e5e7eb;
            box-shadow:
                0 1px 2px rgba(43, 99, 217, 0.06),
                0 16px 48px -12px rgba(30, 64, 175, 0.14);
        }
        .input-wrapper {
            background-color: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 1rem;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            padding: 0.8rem 1.15rem;
        }
        .input-wrapper:focus-within {
            background-color: #ffffff;
            border-color: #2b63d9;
            box-shadow: 0 0 0 4px rgba(43, 99, 217, 0.12);
        }
        .input-clean {
            background: transparent !important;
            outline: none !important;
            border: none !important;
            width: 100%;
            font-size: 1.0625rem;
            font-weight: 600;
            color: #1f2937;
        }
        .btn-primary-login {
            background-color: #2b63d9;
            transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }
        .btn-primary-login:hover {
            background-color: #2457c2;
            box-shadow: 0 10px 28px -8px rgba(43, 99, 217, 0.45);
        }
        .btn-primary-login:active { transform: scale(0.98); }
        .notice-banner {
            border-radius: 0.875rem;
            border: 1px solid;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">

    <header class="header-pro shadow-lg sticky top-0 z-40" role="banner"></header>

    <div class="flex min-h-[calc(100vh-90px)] justify-center items-center px-4 py-10 sm:p-6">
        <main class="max-w-md w-full main-frame-white p-8 sm:p-10">

            <div class="flex flex-col items-center text-center mb-8">
                <div class="relative mb-4">
                    <div class="absolute inset-0 rounded-full bg-[#2b63d9]/20 blur-xl scale-125" aria-hidden="true"></div>
                    <img src="{% static 'logo.jpg' %}" alt="Logo" width="80" height="80" class="relative w-20 h-20 rounded-full border-2 border-gray-100 p-1 shadow-md object-cover">
                </div>
                <h2 class="text-3xl font-black text-gray-800 tracking-tight">SchoolTrack</h2>
                <p class="text-blue-600 font-bold uppercase text-[11px] sm:text-xs mt-2 tracking-[0.2em]">Panel de Administrador</p>
            </div>

            <div id="bannerValidation" class="notice-banner {% if error %}mb-5{% else %}mb-6{% endif %} hidden border-amber-200/90 bg-gradient-to-br from-amber-50 via-white to-amber-50/30 p-4 shadow-sm" role="alert">
                <div class="flex gap-3 items-start">
                    <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-100 text-amber-600" aria-hidden="true"><i class="fa-solid fa-triangle-exclamation text-lg"></i></span>
                    <div class="min-w-0 flex-1 pt-0.5">
                        <p class="text-[11px] font-bold uppercase tracking-wider text-amber-900/75">Campos incompletos</p>
                        <p class="text-sm font-medium text-amber-950/85 mt-0.5 leading-snug">Completa usuario y clave para continuar.</p>
                    </div>
                    <button type="button" class="shrink-0 rounded-lg p-1.5 text-amber-700/70 hover:bg-amber-100/80 hover:text-amber-900 transition-colors" onclick="document.getElementById('bannerValidation').classList.add('hidden')" aria-label="Cerrar aviso">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            </div>

            <div id="bannerError" class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4 shadow-lg hidden" role="alert">
                <div class="flex items-center gap-3">
                    <div class="flex-shrink-0 w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-exclamation-triangle text-red-600 text-lg"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-sm font-semibold text-red-900 mb-1">Error de autenticación</h3>
                        <p class="text-sm text-red-700"></p>
                    </div>
                    <button type="button" class="flex-shrink-0 text-red-400 hover:text-red-600 transition-colors p-1" onclick="document.getElementById('bannerError').classList.add('hidden')" aria-label="Cerrar">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>
            </div>

            <form id="loginForm" method="POST" action="" autocomplete="off" class="space-y-5">
                {% csrf_token %}
                <input type="hidden" name="ajax" value="1">

                <div>
                    <label class="block text-[11px] font-black text-gray-500 uppercase tracking-widest mb-2 ml-0.5">Usuario Administrador <span class="text-red-500">*</span></label>
                    <div class="input-wrapper">
                        <span class="mr-3 text-gray-400" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
                        </span>
                        <input type="text" id="usuario" name="usuario" placeholder="Usuario Administrador" class="input-clean" autocomplete="off" readonly>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-black text-gray-500 uppercase tracking-widest mb-2 ml-0.5">Clave de Acceso <span class="text-red-500">*</span></label>
                    <div class="input-wrapper relative">
                        <span class="mr-3 text-gray-400" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                        </span>
                        <input type="password" id="password" name="contrasena" placeholder="••••••••" class="input-clean" autocomplete="off" readonly>
                        <button type="button" onclick="togglePassword()" class="ml-2 shrink-0 text-gray-400 hover:text-[#2b63d9] outline-none rounded-lg p-1 transition-colors" aria-label="Mostrar u ocultar contraseña">
                            <svg id="eyeIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            <svg id="eyeOffIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary-login w-full text-white font-black py-3.5 sm:py-4 rounded-xl text-base sm:text-lg shadow-lg tracking-[0.12em] mt-2">
                    INGRESAR AL SISTEMA
                </button>

                <div class="flex flex-col-reverse sm:flex-row sm:justify-between sm:items-center gap-3 text-xs font-bold pt-1">
                    <label class="flex items-center gap-2 cursor-pointer text-gray-500 select-none">
                        <input type="checkbox" name="remember" class="rounded border-gray-300 text-[#2b63d9] focus:ring-[#2b63d9]"> Recordar datos
                    </label>
                    <a href="#" class="text-[#2b63d9] hover:text-[#1e40af] font-semibold transition-colors">¿Problemas de acceso?</a>
                </div>
            </form>

            <div class="mt-10 pt-6 border-t border-gray-100 text-center text-gray-400 text-[10px] font-bold uppercase tracking-widest">
                © 2026 schooltrack.mx - Sistema Integral
            </div>
        </main>
    </div>

    <script>
        // Evitar autocompletado del navegador
        document.addEventListener('DOMContentLoaded', function() {
            const usuarioField = document.getElementById('usuario');
            const passField = document.getElementById('password');
            
            // Limpiar cualquier valor inicial
            usuarioField.value = '';
            passField.value = '';
            
            // Al hacer foco, habilitar edición
            usuarioField.addEventListener('focus', function() {
                this.removeAttribute('readonly');
            });
            passField.addEventListener('focus', function() {
                this.removeAttribute('readonly');
            });
        });

        function togglePassword() {
            const pass = document.getElementById("password");
            const eye = document.getElementById("eyeIcon");
            const eyeOff = document.getElementById("eyeOffIcon");
            if (pass.type === "password") {
                pass.type = "text";
                eye.classList.remove("hidden");
                eyeOff.classList.add("hidden");
            } else {
                pass.type = "password";
                eye.classList.add("hidden");
                eyeOff.classList.remove("hidden");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const user = document.getElementById("usuario").value.trim();
            const pass = document.getElementById("password").value.trim();
            if (!user || !pass) {
                document.getElementById("bannerValidation").classList.remove("hidden");
                return;
            }

            // Guardar valores escritos antes de enviar
            const usuarioEscrito = document.getElementById("usuario").value;
            const contrasenaEscrita = document.getElementById("password").value;

            // Enviar formulario vía AJAX
            const formData = new FormData(this);
            fetch('', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    // Restaurar valores escritos
                    document.getElementById("usuario").value = usuarioEscrito;
                    document.getElementById("password").value = contrasenaEscrita;
                    
                    // Mostrar error
                    const bannerError = document.getElementById('bannerError');
                    if (bannerError) {
                        bannerError.querySelector('p.text-sm.text-red-700').textContent = data.error;
                        bannerError.classList.remove('hidden');
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
