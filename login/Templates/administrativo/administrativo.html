{% extends 'base/dashboard_administrativo.html' %}

{% block title %}SchoolTrack - Panel Administrativo{% endblock %}

{% block content %}
<h2 class="text-5xl font-bold text-center mb-12 text-gray-800">Panel Administrativo</h2>
            
            <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12">
                
                <div class="bg-white p-10 rounded-xl border-2 border-gray-200 shadow-sm flex flex-col items-center justify-center min-h-[280px]">
                    <a href="{% url 'admin_reportes' %}" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-6 px-10 rounded-2xl shadow-lg flex flex-col items-center gap-4 transition transform hover:scale-105 w-full sm:w-64">
                        <i class="fas fa-chart-bar text-4xl"></i>
                        <span class="text-center text-lg leading-tight">Consultar Reportes Académicos</span>
                    </a>
                </div>

                <div class="bg-white p-10 rounded-xl border-2 border-gray-200 shadow-sm flex flex-col items-center justify-center min-h-[280px]">
                    <a href="{% url 'admin_horarios' %}" class="bg-green-500 hover:bg-green-600 text-white font-bold py-6 px-10 rounded-2xl shadow-lg flex flex-col items-center gap-4 transition transform hover:scale-105 w-full sm:w-64">
                        <i class="fas fa-calendar-alt text-4xl"></i>
                        <span class="text-center text-lg leading-tight">Gestionar Horarios Académicos</span>
                    </a>
                </div>

                {% include 'partials/dashboard_ciclo_cards.html' %}

            </div>
{% endblock %}
