{% with nav=request.resolver_match.url_name|default:'' %}
<aside class="sidebar bg-gray-200 border-r border-gray-300 shadow-inner">
    <nav class="space-y-4">
        <a href="{% url 'dashboard_maestro' %}"
           class="nav-item {% if nav == 'dashboard_maestro' %}nav-item-active text-gray-800 shadow-sm{% else %}text-gray-700{% endif %}">
            <i class="fas fa-user text-xl {% if nav == 'dashboard_maestro' %}text-blue-600{% endif %}"></i> Mi Perfil
        </a>
        <a href="{% url 'registrar_asistencia' %}"
           class="nav-item {% if nav == 'registrar_asistencia' or nav == 'get_datos_asistencia_maestro' or nav == 'guardar_asistencia_maestro' %}nav-item-active text-gray-800 shadow-sm{% else %}text-gray-700{% endif %}">
            <i class="fas fa-edit text-xl {% if nav == 'registrar_asistencia' or nav == 'get_datos_asistencia_maestro' or nav == 'guardar_asistencia_maestro' %}text-blue-600{% endif %}"></i> Registrar Asistencia
        </a>
        <a href="{% url 'registrar_calificaciones' %}"
           class="nav-item {% if nav == 'registrar_calificaciones' or nav == 'get_datos_calificaciones_maestro' or nav == 'guardar_calificaciones_maestro' %}nav-item-active text-gray-800 shadow-sm{% else %}text-gray-700{% endif %}">
            <i class="fas fa-file-signature text-xl {% if nav == 'registrar_calificaciones' or nav == 'get_datos_calificaciones_maestro' or nav == 'guardar_calificaciones_maestro' %}text-blue-600{% endif %}"></i> Registrar Calificaciones
        </a>
        <a href="{% url 'consultar_reportes' %}"
           class="nav-item {% if nav == 'consultar_reportes' %}nav-item-active text-gray-800 shadow-sm{% else %}text-gray-700{% endif %}">
            <i class="fas fa-file-alt text-xl {% if nav == 'consultar_reportes' %}text-blue-600{% endif %}"></i> Consultar Reportes
        </a>
        <a href="{% url 'logout' %}" class="nav-item text-red-600 hover:bg-red-100 uppercase nav-logout">
            <i class="fas fa-sign-out-alt text-xl"></i> Cerrar Sesión
        </a>
    </nav>
</aside>
{% endwith %}
