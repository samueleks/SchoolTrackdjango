{% load static %}
<div class="flex flex-col items-center text-center mb-8">
    <div class="relative mb-4">
        <div class="absolute inset-0 rounded-full bg-[#2b63d9]/20 blur-xl scale-125" aria-hidden="true"></div>
        <img src="{% static 'logo.png' %}" alt="Logo SchoolTrack" width="80" height="80"
             class="relative w-20 h-20 rounded-full border-2 border-gray-100 p-1 shadow-md object-cover">
    </div>
    <h2 class="text-2xl sm:text-3xl font-black text-gray-800 tracking-tight">{{ titulo_pagina }}</h2>
    {% if rol_etiqueta %}
    <p class="text-blue-600 font-bold uppercase text-[11px] sm:text-xs mt-2 tracking-[0.2em]">{{ rol_etiqueta }}</p>
    {% endif %}
</div>
